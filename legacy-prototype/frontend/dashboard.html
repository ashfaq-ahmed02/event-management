<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · College Events</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="wrap"><h2>Student Dashboard</h2><div class="stats" id="stats"></div>
<h2>My Registrations</h2><div class="scroll"><table><thead><tr><th>Event</th><th>Date</th><th>Venue</th><th>Status</th><th></th></tr></thead><tbody id="regs"></tbody></table></div>
<h2>My Documents</h2><div class="two"><form class="card" id="up"><label>Document type</label><select name="doc_type"><option>ID Proof</option><option>Permission Letter</option><option>Certificate</option><option>Other</option></select><label>Related event (optional)</label><select name="event_id" id="evsel"><option value="">None</option></select><label>File (PDF, JPG, PNG, DOCX · 5 MB)</label><input type="file" name="file" required><p><button class="btn">Upload</button></p><div id="msg"></div></form>
<div class="scroll"><table><thead><tr><th>Type</th><th>File</th><th>Event</th><th></th></tr></thead><tbody id="docs"></tbody></table></div></div></div>
<script src="/js/app.js"></script><script>initLayout();
const u=guard();
async function load(){
  const r=await api("/my/registrations");
  stats.innerHTML=`<div class="stat"><b>${r.length}</b>Registered</div><div class="stat"><b>${r.filter(x=>x.status=="approved").length}</b>Approved</div><div class="stat"><b>${r.filter(x=>x.status=="pending").length}</b>Pending</div>`;
  regs.innerHTML=r.map(x=>`<tr><td><a href="/event.html?id=${x.event_id}">${esc(x.title)}</a></td><td>${fmt(x.event_date)}</td><td>${esc(x.venue)}</td><td><span class="tag ${x.status}">${x.status}</span></td><td><button class="btn sm bad" onclick="cancel(${x.event_id})">Cancel</button></td></tr>`).join("")||"<tr><td colspan=5 class=muted>No registrations yet.</td></tr>";
  const d=await api("/documents");
  docs.innerHTML=d.map(x=>`<tr><td>${esc(x.doc_type)}</td><td><a href="#" onclick="downloadDoc(${x.id},'${esc(x.filename)}');return false">${esc(x.filename)}</a></td><td>${esc(x.event||"-")}</td><td><button class="btn sm bad" onclick="del(${x.id})">Delete</button></td></tr>`).join("")||"<tr><td colspan=4 class=muted>No documents uploaded.</td></tr>";
}
async function cancel(id){await api("/events/"+id+"/register",{method:"DELETE"});load()}
async function del(id){await api("/documents/"+id,{method:"DELETE"});load()}
up.onsubmit=async e=>{e.preventDefault();try{await api("/documents",{method:"POST",body:new FormData(up)});up.reset();showMsg("msg","Uploaded",1);load()}catch(x){showMsg("msg",x.message)}};
api("/events").then(ev=>evsel.insertAdjacentHTML("beforeend",ev.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join("")));
if(u)load();</script></body></html>
