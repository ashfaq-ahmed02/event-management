<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · College Events</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="wrap"><h2>Admin Dashboard</h2><div class="stats" id="stats"></div>
<div class="two"><form class="card" id="f"><h3 id="ft">Add Event</h3><input type="hidden" name="id"><label>Title</label><input name="title" required><label>Description</label><textarea name="description" rows="3"></textarea><label>Category</label><select name="category"><option>Technical</option><option>Cultural</option><option>Sports</option><option>General</option></select><label>Venue</label><input name="venue"><label>Date &amp; time</label><input name="event_date" type="datetime-local" required><label>Capacity</label><input name="capacity" type="number" min="1" value="100" required><p><button class="btn">Save event</button> <button type="button" class="btn line" onclick="f.reset();ft.textContent='Add Event'">Clear</button></p><div id="msg"></div></form>
<div><h3>Events</h3><div class="scroll"><table><thead><tr><th>Event</th><th>Regs</th><th></th></tr></thead><tbody id="evs"></tbody></table></div></div></div>
<h2 id="rt">Registrations</h2><div class="scroll"><table><thead><tr><th>Student</th><th>Dept</th><th>Status</th><th>Action</th></tr></thead><tbody id="regs"><tr><td colspan=4 class=muted>Click "Regs" on an event above.</td></tr></tbody></table></div>
<h2>All Documents</h2><div class="scroll"><table><thead><tr><th>Student</th><th>Type</th><th>File</th><th>Event</th></tr></thead><tbody id="docs"></tbody></table></div></div>
<script src="/js/app.js"></script><script>initLayout();
guard("admin");let list=[];
async function load(){
  const s=await api("/stats");stats.innerHTML=[["events","Events"],["students","Students"],["registrations","Registrations"],["documents","Documents"]].map(([k,l])=>`<div class="stat"><b>${s[k]}</b>${l}</div>`).join("");
  list=await api("/events");
  evs.innerHTML=list.map(e=>`<tr><td>${esc(e.title)}<br><span class="muted">${fmt(e.event_date)}</span></td><td>${e.registered}/${e.capacity}</td><td><button class="btn sm" onclick="regsOf(${e.id})">Regs</button> <button class="btn sm line" onclick="edit(${e.id})">Edit</button> <button class="btn sm bad" onclick="del(${e.id})">Del</button></td></tr>`).join("");
  const d=await api("/documents");
  docs.innerHTML=d.map(x=>`<tr><td>${esc(x.owner)}</td><td>${esc(x.doc_type)}</td><td><a href="#" onclick="downloadDoc(${x.id},'${esc(x.filename)}');return false">${esc(x.filename)}</a></td><td>${esc(x.event||"-")}</td></tr>`).join("")||"<tr><td colspan=4 class=muted>None yet.</td></tr>";
}
function edit(id){const e=list.find(x=>x.id==id);for(const k of ["id","title","description","category","venue","event_date","capacity"])f.elements[k].value=e[k]??"";ft.textContent="Edit Event";scrollTo(0,0)}
f.onsubmit=async ev=>{ev.preventDefault();const b=Object.fromEntries(new FormData(f));b.capacity=+b.capacity;const id=b.id;delete b.id;
  try{await api(id?"/events/"+id:"/events",{method:id?"PUT":"POST",body:b});f.reset();ft.textContent="Add Event";showMsg("msg","Saved",1);load()}catch(e){showMsg("msg",e.message)}};
async function del(id){if(confirm("Delete this event and its registrations?")){await api("/events/"+id,{method:"DELETE"});load()}}
async function regsOf(id){const r=await api("/admin/events/"+id+"/registrations");rt.textContent="Registrations: "+list.find(e=>e.id==id).title;
  regs.innerHTML=r.map(x=>`<tr><td>${esc(x.name)}<br><span class="muted">${esc(x.email)}</span></td><td>${esc(x.department)}</td><td><span class="tag ${x.status}">${x.status}</span></td><td><button class="btn sm" onclick="setS(${x.id},'approved',${id})">Approve</button> <button class="btn sm bad" onclick="setS(${x.id},'rejected',${id})">Reject</button></td></tr>`).join("")||"<tr><td colspan=4 class=muted>No registrations yet.</td></tr>"}
async function setS(rid,status,eid){await api("/admin/registrations/"+rid,{method:"PATCH",body:{status}});regsOf(eid);load()}
load();</script></body></html>
