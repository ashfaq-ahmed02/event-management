<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event · College Events</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="wrap"><div class="card" id="ev">Loading...</div><div id="msg"></div></div>
<script src="/js/app.js"></script><script>initLayout();
const id=new URLSearchParams(location.search).get("id"),u=me();
async function load(){
  const ev=await api("/events/"+id),mine=u?(await api("/my/registrations")).find(r=>r.event_id==ev.id):null,left=ev.capacity-ev.registered;
  const action=!u?`<a class="btn gold" href="/login.html">Login to register</a>`:u.role==="admin"?"":mine?`<span class="tag ${mine.status}">Registered · ${mine.status}</span> <button class="btn sm bad" onclick="cancel()">Cancel</button>`:`<button class="btn gold" ${left<=0?"disabled":""} onclick="reg()">${left<=0?"Event full":"Register now"}</button>`;
  document.getElementById("ev").innerHTML=`<span class="tag">${esc(ev.category)}</span><h2>${esc(ev.title)}</h2><p>${esc(ev.description)}</p><p class="muted">📅 ${fmt(ev.event_date)}<br>📍 ${esc(ev.venue)}<br>🎟 ${ev.registered}/${ev.capacity} registered · ${left} seats left</p>${action}`;
}
async function reg(){try{await api("/events/"+id+"/register",{method:"POST"});await load();showMsg("msg","Registration submitted!",1)}catch(e){showMsg("msg",e.message)}}
async function cancel(){await api("/events/"+id+"/register",{method:"DELETE"});load()}
load().catch(e=>document.getElementById("ev").textContent=e.message);</script></body></html>
